<!--
  Bloque "Río Paraná" para la franja #barra-vivos-unificada-final de la portada, como iframe
  (sin JavaScript en la plantilla). Pegar dentro de .barra-unificada__interior, después del
  bloque "Estado del tránsito". El iframe es widget-rios.ellitoral.com/franja: en desktop se
  ve en la misma fila; entre 481 y 1279 px pasa a su propia línea; en celular es la tercera
  celda de la grilla.
-->
<span class="separador-bullet rio-sep">•</span>
<iframe class="rio-franja" src="https://widget-rios.ellitoral.com/franja" title="Altura del río Paraná" scrolling="no" frameborder="0"></iframe>
<style>
  #barra-vivos-unificada-final .rio-franja { border: 0; width: 400px; height: 22px; flex: none; }
  @media (min-width: 481px) and (max-width: 1279px) {
    #barra-vivos-unificada-final .barra-unificada__interior { flex-wrap: wrap; }
    #barra-vivos-unificada-final .rio-sep { display: none; }
    #barra-vivos-unificada-final .rio-franja { flex-basis: 100%; }
  }
  @media (max-width: 480px) {
    #barra-vivos-unificada-final .rio-franja { width: 100%; height: 70px; }
    /* el sitio pinta el borde rojo con :last-child; con el iframe al final, tránsito deja de serlo */
    #barra-vivos-unificada-final .bloque-item:last-of-type { border-top: 2px solid #e73232; }
  }
</style>
