name: Actualizar dato del INA

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/actualizar.mjs
      - name: Commitear si el dato cambió
        run: |
          git diff --quiet -- public/datos.json && { echo "Sin cambios"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/datos.json
          git commit -m "Dato del INA $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
