name: Prueba Prefectura (temporal)

on: workflow_dispatch

permissions: {}

jobs:
  prueba:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: IPv4
        run: curl -4 -sS -o /dev/null --max-time 25 -w "IPv4: %{http_code} %{size_download} bytes %{time_total}s ip %{remote_ip}\n" https://contenidosweb.prefecturanaval.gob.ar/alturas/ || true
      - name: IPv6
        run: curl -6 -sS -o /dev/null --max-time 25 -w "IPv6: %{http_code} %{size_download} bytes %{time_total}s ip %{remote_ip}\n" https://contenidosweb.prefecturanaval.gob.ar/alturas/ || true
      - name: Node fetch
        run: node -e "fetch('https://contenidosweb.prefecturanaval.gob.ar/alturas/', { signal: AbortSignal.timeout(25000) }).then(async r => console.log('node:', r.status, (await r.text()).length, 'bytes')).catch(e => console.log('node falló:', e.cause?.code ?? e.message))"
