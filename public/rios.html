<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ríos en Santa Fe — El Litoral</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff;
    --ink: #111111;
    --ink-2: #4a4a4a;
    --muted: #767676;
    --line: #e4e4e4;
    --brand: #216497;
    --alert: #b86e00;
    --evac: #c62828;
    --ok: #2e7d32;
  }
  :root[data-theme="dark"] {
    --bg: #121417;
    --ink: #f2f2f2;
    --ink-2: #c4c7cc;
    --muted: #8f949b;
    --line: #2c3036;
    --brand: #5bb4ea;
    --alert: #ffb829;
    --evac: #ff6b6b;
    --ok: #66bb6a;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 400 14px/1.35 Roboto, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .w {
    height: 100%;
    display: flex;
    flex-direction: column;
    gap: 16px;
    padding: 20px;
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
  }
  header { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .kicker { font-size: 12px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--brand); }
  header .kicker { color: var(--ink-2); font-size: 13px; }
  .brand { font-size: 13px; font-weight: 900; color: var(--brand); white-space: nowrap; text-decoration: none; }

  /* --- ESTRUCTURA DESKTOP (3 COLUMNAS TIPO TARJETA) --- */
  #filas {
    flex: 1;
    display: flex;
    flex-direction: row;
    gap: 0;
  }

  .fila {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    padding: 0 20px;
    border-right: 1px solid var(--line);
  }

  .fila:first-child {
    padding-left: 0;
  }

  .fila:last-child {
    border-right: 0;
    padding-right: 0;
  }

  .izq {
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-width: 0;
    order: 1;
  }

  .num {
    font-size: 42px;
    font-weight: 900;
    line-height: 1;
    letter-spacing: -.02em;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    order: 2;
    margin-top: 10px;
    margin-bottom: 12px;
  }

  .num small {
    font-size: 20px;
    font-weight: 400;
    color: var(--ink);
    margin-left: 2px;
    letter-spacing: 0;
  }

  .status {
    order: 3;
    font-size: 13px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 6px;
  }

  .status .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: currentColor;
    flex: none;
  }

  .meta {
    order: 4;
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    line-height: 1.4;
  }

  .warn {
    order: 5;
    font-size: 12px;
    color: var(--alert);
    font-weight: 500;
    margin-top: 4px;
  }

  .fila[data-s="normal"] .status { color: var(--ok); }
  .fila[data-s="alerta"] .status { color: var(--alert); }
  .fila[data-s="evac"] .status { color: var(--evac); }
  .fila[data-s="viejo"] .status, .fila[data-s="viejo"] .num { color: var(--muted); }

  footer {
    display: flex;
    justify-content: space-between;
    gap: 4px 12px;
    flex-wrap: wrap;
    font-size: 12px;
    color: var(--muted);
    border-top: 1px solid var(--line);
    padding-top: 14px;
    margin-top: 4px;
  }
  footer a { color: inherit; }
  footer strong { color: var(--ink-2); font-weight: 700; }
  .msg { flex: 1; display: grid; place-items: center; text-align: center; color: var(--ink-2); padding: 12px; }

  /* --- ADAPTACIÓN MOBILE (< 600px - UNO DEBAJO DEL OTRO) --- */
  @media (max-width: 600px) {
    .w { gap: 10px; padding: 14px 16px 12px; }

    #filas {
      flex-direction: column;
    }

    .fila {
      display: grid;
      grid-template-columns: 1fr auto;
      grid-template-areas:
        "izq num"
        "status num"
        "meta num"
        "warn num";
      border-right: 0;
      border-top: 1px solid var(--line);
      padding: 12px 0;
    }

    .fila:first-child {
      border-top: 0;
      padding-top: 4px;
    }

    .izq { grid-area: izq; margin-bottom: 4px; }
    .izq .kicker { color: var(--ink-2); }

    .num {
      grid-area: num;
      align-self: center;
      font-size: 36px;
      margin-top: 0;
      margin-bottom: 0;
      padding-left: 12px;
    }

    .num small { font-size: 16px; }

    .status { grid-area: status; margin-bottom: 4px; }
    .meta { grid-area: meta; }
    .warn { grid-area: warn; }

    footer {
      flex-direction: column;
      gap: 6px;
      padding-top: 10px;
    }
  }
</style>
</head>
<body>
<div class="w">
  <header>
    <span class="kicker">Altura de los ríos · Santa Fe</span>
    <a class="brand" href="https://www.ellitoral.com" target="_blank" rel="noopener">El Litoral</a>
  </header>

  <div id="filas"><div class="msg">Consultando las últimas alturas…</div></div>

  <footer>
    <span>Paraná: <a href="https://alerta.ina.gob.ar/a5/diario/reporte_diario" target="_blank" rel="noopener">INA</a> / Prefectura · Salado: <a href="https://www.santafe.gob.ar/idesf/vis-pre/?user=rec_hidricos_alturas" target="_blank" rel="noopener">Rec. Hídricos Santa Fe</a></span>
    <span>Emergencias: <strong>Defensa Civil 103</strong></span>
  </footer>
</div>

<script>
(() => {
  const TZ = 'America/Argentina/Buenos_Aires';
  if (new URLSearchParams(location.search).get('theme') === 'dark') document.documentElement.dataset.theme = 'dark';

  const fmt = n => n.toLocaleString('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const dia = t => new Date(t).toLocaleDateString('es-AR', { timeZone: TZ, day: 'numeric', month: 'numeric' });
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const filas = document.getElementById('filas');

  // Avisa el alto natural (sin estirarse al iframe) con el mismo mensaje que las tablas,
  // para que la página de altura de los ríos ajuste el iframe.
  const w = document.querySelector('.w');
  const avisarAlto = () => {
    w.style.height = 'auto';
    const alto = Math.ceil(w.getBoundingClientRect().height);
    w.style.height = '';
    parent.postMessage({ 'datawrapper-height': { rios: alto } }, '*');
    return alto;
  };
  addEventListener('resize', avisarAlto);
  // La página puede empezar a escuchar después (Cloudflare demora sus scripts): se repite
  // el aviso cada segundo hasta que el iframe toma el alto, como mucho 30 veces.
  const insistir = (n = 0) => { if (Math.abs(innerHeight - avisarAlto()) > 1 && n < 30) setTimeout(insistir, 1000, n + 1); };

  // rios.json lo genera scripts/actualizar.mjs cada 30 minutos (INA y Rec. Hídricos Santa Fe)
  fetch('rios.json', { cache: 'no-cache' })
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(rios => { filas.innerHTML = rios.map(fila).join(''); })
    .catch(() => { filas.innerHTML = '<div class="msg">No pudimos obtener las alturas en este momento.<br>Volvé a intentar en unos minutos.</div>'; })
    .finally(insistir);

  function fila(r) {
    const titulo = `<span class="kicker">${esc(r.rio)} · ${esc(r.estacion)}</span>`;
    const [u, ant] = r.lecturas;
    if (!u) return `<div class="fila" data-s="viejo"><div class="izq">${titulo}<span class="meta">Sin datos recientes</span></div></div>`;

    const dias = Math.floor((Date.now() - new Date(u.t)) / 864e5);
    const viejo = dias >= 2;
    let s = 'normal';
    let txt = `${viejo ? 'Faltaban' : 'Faltan'} ${fmt(r.alerta - u.v)} m para la alerta (${fmt(r.alerta)} m)`;
    if (r.evac != null && u.v >= r.evac) { s = 'evac'; txt = `${viejo ? 'Superaba' : 'Superó'} la evacuación (${fmt(r.evac)} m)`; }
    else if (u.v >= r.alerta) { s = 'alerta'; txt = `${viejo ? 'Superaba' : 'Superó'} la alerta (${fmt(r.alerta)} m)`; }
    if (viejo) s = 'viejo';

    let meta = `Lectura del ${dia(u.t)}`;
    if (ant && new Date(u.t) - new Date(ant.t) < 1.5 * 864e5) {
      const cm = Math.round((u.v - ant.v) * 100);
      meta += cm === 0 ? ' · sin cambios en el día' : ` · ${cm > 0 ? '▲ subió' : '▼ bajó'} ${Math.abs(cm)} cm en el día`;
    }
    const aviso = viejo ? `<span class="warn">⚠ Dato de hace ${dias} días: no hay lecturas nuevas</span>` : '';

    return `<div class="fila" data-s="${s}">
      <div class="izq">${titulo}</div>
      <div class="num">${fmt(u.v)}<small>m</small></div>
      <span class="status"><span class="dot"></span>${txt}</span>
      <span class="meta">${meta}</span>
      ${aviso}
    </div>`;
  }
})();
</script>
</body>
</html>
